<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <meta name="theme-color" content="#07293d" />
    <title>Yuko SENGOKU - Fullstack Developper</title>
    <link rel="icon" type="image/x-icon" href="/img/navbar-logo.svg" />
    <style>
      html,
      body {
        margin: 0;
        background: #07293d;
      }
      .boot {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        /* Fades from the sky into the ocean colors, where the globe will appear */
        background: linear-gradient(to bottom, #07293d 40%, #134a6a 75%, #216e9b);
      }
      .boot-text {
        position: absolute;
        left: 0;
        right: 0;
        top: 50dvh;
        margin: 0;
        padding: 0 16px;
        text-align: center;
        color: #f1f0f0;
        font: 400 1.25rem/1.5 'Hiragino Sans', 'Yu Gothic', sans-serif;
        letter-spacing: 0.04em;
        animation: boot-pulse 1.6s ease-in-out infinite alternate;
      }
      @keyframes boot-pulse {
        from {
          opacity: 0.45;
          transform: scale(1);
        }
        to {
          opacity: 0.7;
          transform: scale(1.06);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-text {
          animation: none;
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body id="page-top">
    <div id="app">
      <div class="boot" role="status">
        <p class="boot-text">Getting ready for a look around…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
