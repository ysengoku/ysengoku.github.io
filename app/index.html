<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <meta name="theme-color" content="#07293d" />
    <title>Yuko SENGOKU - Software Engineer</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        background: #07293d;
      }
      .boot {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background: linear-gradient(to bottom, #07293d 40%, #134a6a 75%, #216e9b);
        text-align: center;
        color: #f1f0f0;
        font: 400 1rem/1.5 'Hiragino Sans', 'Yu Gothic', sans-serif;
      }
      .boot-text,
      .boot-timeout {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0;
        padding: 0 16px;
      }
      .boot-text {
        top: 50dvh;
        letter-spacing: 0.04em;
        animation: boot-pulse 1.6s ease-in-out infinite alternate;
      }
      .boot-timeout {
        font-size: 0.9rem;
        top: calc(50dvh + 3rem);
        opacity: 0;
        visibility: hidden;
        pointer-events: auto;
        animation: boot-show 0.4s ease-out 8s forwards;
      }
      .boot-timeout a {
        color: inherit;
      }
      @keyframes boot-pulse {
        from {
          opacity: 0.45;
          transform: scale(1);
        }
        to {
          opacity: 0.7;
          transform: scale(1.06);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-text {
          animation: none;
          opacity: 0.8;
        }
      }
      @keyframes boot-show {
        to {
          opacity: 0.8;
          visibility: visible;
        }
      }
    </style>
  </head>
  <body id="page-top">
    <div id="app">
      <div class="boot" role="status">
        <p class="boot-text">Getting ready for a look around…</p>
      </div>
      <div class="boot" role="status">
        <p class="boot-text">Getting ready for a look around</p>
        <p class="boot-timeout">
          This is taking longer than usual. <a href="">Try reloading</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
